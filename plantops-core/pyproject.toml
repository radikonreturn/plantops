[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plantops-sim"
version = "0.1.0"
description = "Deterministic discrete-event production line simulator for PlantOps"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn>=0.30,<0.31",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<0.29",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
